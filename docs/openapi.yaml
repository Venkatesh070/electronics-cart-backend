openapi: 3.0.3
info:
  title: Electronics Cart API
  description: |
    Ecommerce backend for customer storefront and admin panel.
    Authenticate with **Authorize** → Bearer JWT from `/api/auth/login` or `/api/auth/register`.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:5000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Addresses
  - name: Payment Methods
  - name: Products
  - name: Categories
  - name: Brands
  - name: Search
  - name: Wishlist
  - name: Cart
  - name: Orders
  - name: Returns
  - name: Reviews
  - name: Questions
  - name: Coupons
  - name: Gift Cards
  - name: Notifications
  - name: Support
  - name: CMS
  - name: Blog
  - name: Banners
  - name: Flash Sales
  - name: Newsletter
  - name: Shipping
  - name: Admin Dashboard
  - name: Admin Inventory
  - name: Admin Customers
  - name: Admin Marketing
  - name: Admin Settings
  - name: Admin Roles
  - name: Admin Reports
  - name: Analytics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data: {}
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }
    RegisterBody:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: John Doe }
        email: { type: string, format: email, example: john@example.com }
        password: { type: string, format: password, minLength: 6, example: secret123 }
        phone: { type: string }
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AddressBody:
      type: object
      required: [fullName, line1, city, state, postalCode, country]
      properties:
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        label: { type: string, enum: [home, work, other] }
        isDefault: { type: boolean }
    CartItemBody:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
    CreateOrderBody:
      type: object
      properties:
        addressId: { type: string, description: Saved address id }
        shippingAddress:
          $ref: '#/components/schemas/AddressBody'
        deliverySlot: { type: string, example: tomorrow-morning }
        paymentMethod: { type: string, example: UPI, description: card | UPI | netbanking | wallet | COD | EMI }
    ProductCreate:
      type: object
      required: [name, description, price, category, brand]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        images: { type: array, items: { type: string } }
        video: { type: string }
        category: { type: string }
        brand: { type: string }
        stock: { type: integer }
        status: { type: string, enum: [draft, published, archived] }
        variants: { type: array, items: { type: object } }
        specifications: { type: object }
        boxContents: { type: array, items: { type: string } }
        warranty: { type: string }
        seo: { type: object }
    OrderStatus:
      type: string
      enum: [pending, confirmed, paid, shipped, out_for_delivery, delivered, cancelled]

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      description: |
        Email/password login. When Firebase is configured (`FIREBASE_API_KEY` + service account),
        credentials are verified via Firebase Identity Toolkit. Otherwise falls back to local password hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: JWT + user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/auth/firebase:
    post:
      tags: [Auth]
      summary: Sign in with Firebase ID token
      description: |
        Accepts a Firebase ID token from Google, phone OTP, or email/password client sign-in.
        Creates or links the local user and returns an app JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string, description: Firebase ID token from client SDK }
                name: { type: string, description: Optional display name for first-time users }
      responses:
        '200':
          description: Existing user signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '201':
          description: New user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/users/me:
    put:
      tags: [Profile]
      summary: Update profile
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                dob: { type: string, format: date }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/users/me/password:
    put:
      tags: [Profile]
      summary: Change password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: Password updated

  /api/users/me/notification-preferences:
    put:
      tags: [Profile]
      summary: Update notification preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderUpdates: { type: boolean }
                priceDrops: { type: boolean }
                promotions: { type: boolean }
                supportReplies: { type: boolean }
      responses:
        '200':
          description: Preferences updated

  /api/addresses:
    get:
      tags: [Addresses]
      summary: List addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Address list
    post:
      tags: [Addresses]
      summary: Create address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBody'
      responses:
        '201':
          description: Created

  /api/addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBody'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Addresses]
      summary: Delete address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

  /api/payment-methods:
    get:
      tags: [Payment Methods]
      summary: List saved payment methods
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Methods
    post:
      tags: [Payment Methods]
      summary: Add payment method
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, token]
              properties:
                type: { type: string, example: card }
                token: { type: string }
                isDefault: { type: boolean }
      responses:
        '201':
          description: Created

  /api/payment-methods/{id}/default:
    put:
      tags: [Payment Methods]
      summary: Set default payment method
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated

  /api/payment-methods/{id}:
    delete:
      tags: [Payment Methods]
      summary: Remove payment method
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

  /api/products:
    get:
      tags: [Products]
      summary: Product listing (PLP)
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: minRating
          schema: { type: number }
        - in: query
          name: inStock
          schema: { type: string, enum: ['true'] }
        - in: query
          name: sort
          schema: { type: string, enum: [price_asc, price_desc, popularity, newest, rating] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: Paginated products
    post:
      tags: [Products]
      summary: Create product (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Created

  /api/products/compare:
    get:
      tags: [Products]
      summary: Compare up to 4 products
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string }
          description: Comma-separated product ids
      responses:
        '200':
          description: Comparison rows

  /api/products/low-stock:
    get:
      tags: [Products]
      summary: Low stock products (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Low stock list

  /api/products/slug/{slug}:
    get:
      tags: [Products]
      summary: Get product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product
        '404':
          $ref: '#/components/responses/NotFound'

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Get product by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product
    put:
      tags: [Products]
      summary: Update product (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Products]
      summary: Delete product (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

  /api/products/{id}/related:
    get:
      tags: [Products]
      summary: Related products
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Related list

  /api/products/bulk-status:
    put:
      tags: [Products]
      summary: Bulk update product status
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
                status: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: Updated

  /api/products/bulk:
    delete:
      tags: [Products]
      summary: Bulk delete products
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Deleted

  /api/categories:
    get:
      tags: [Categories]
      summary: List category tree
      responses:
        '200':
          description: Categories
    post:
      tags: [Categories]
      summary: Create category (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                image: { type: string }
                parent: { type: string }
      responses:
        '201':
          description: Created

  /api/categories/reorder:
    put:
      tags: [Categories]
      summary: Reorder categories (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderedIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: Reordered

  /api/categories/{slug}:
    get:
      tags: [Categories]
      summary: Get category by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category

  /api/categories/{id}:
    put:
      tags: [Categories]
      summary: Update category (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Categories]
      summary: Delete category (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

  /api/brands:
    get:
      tags: [Brands]
      summary: List brands
      responses:
        '200':
          description: Brands
    post:
      tags: [Brands]
      summary: Create brand (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created

  /api/brands/{slug}:
    get:
      tags: [Brands]
      summary: Get brand by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Brand

  /api/brands/{id}:
    put:
      tags: [Brands]
      summary: Update brand (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Brands]
      summary: Delete brand (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

  /api/search/autocomplete:
    get:
      tags: [Search]
      summary: Autocomplete suggestions
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Suggestions

  /api/search/trending:
    get:
      tags: [Search]
      summary: Trending searches
      responses:
        '200':
          description: Trending queries

  /api/search/recent:
    get:
      tags: [Search]
      summary: Recent searches
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recent queries

  /api/search/log:
    post:
      tags: [Search]
      summary: Log a search
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                resultsCount: { type: integer }
      responses:
        '201':
          description: Logged

  /api/wishlist:
    get:
      tags: [Wishlist]
      summary: Get wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Wishlist

  /api/wishlist/items:
    post:
      tags: [Wishlist]
      summary: Add to wishlist
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '200':
          description: Updated wishlist

  /api/wishlist/items/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove from wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated wishlist

  /api/wishlist/items/{productId}/move-to-cart:
    post:
      tags: [Wishlist]
      summary: Move wishlist item to cart
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Moved

  /api/wishlist/shared/{wishlistId}:
    get:
      tags: [Wishlist]
      summary: Shared wishlist
      parameters:
        - in: path
          name: wishlistId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shared wishlist

  /api/cart:
    get:
      tags: [Cart]
      summary: Get cart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cart
    delete:
      tags: [Cart]
      summary: Clear cart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cleared

  /api/cart/summary:
    get:
      tags: [Cart]
      summary: Cart price breakdown
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: state
          schema: { type: string }
          description: State for tax/shipping
      responses:
        '200':
          description: Summary

  /api/cart/recommendations:
    get:
      tags: [Cart]
      summary: Cross-sell recommendations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Products

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemBody'
      responses:
        '200':
          description: Cart updated

  /api/cart/items/{productId}:
    put:
      tags: [Cart]
      summary: Update item quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Cart]
      summary: Remove item
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed

  /api/cart/items/{productId}/move-to-wishlist:
    post:
      tags: [Cart]
      summary: Move cart item to wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Moved

  /api/cart/coupon:
    post:
      tags: [Cart]
      summary: Apply coupon
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Applied
    delete:
      tags: [Cart]
      summary: Remove coupon
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Removed

  /api/cart/gift-card:
    post:
      tags: [Cart]
      summary: Apply gift card
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Applied

  /api/cart/gift-card/{code}:
    delete:
      tags: [Cart]
      summary: Remove gift card
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed

  /api/orders:
    get:
      tags: [Orders]
      summary: My order history
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Orders
    post:
      tags: [Orders]
      summary: Place order from cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderBody'
      responses:
        '201':
          description: Order created

  /api/orders/admin:
    get:
      tags: [Orders]
      summary: Admin order list
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - in: query
          name: paymentMethod
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: Paginated orders

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Order detail
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
